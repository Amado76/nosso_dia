name: nosso-dia

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosso_dia}
      POSTGRES_USER: ${POSTGRES_USER:-nosso_dia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    profiles: ["app"]
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nosso_dia}
      DB_USERNAME: ${POSTGRES_USER:-nosso_dia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      AUTH_ALLOW_EPHEMERAL_KEY: ${AUTH_ALLOW_EPHEMERAL_KEY:-false}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-nosso-dia}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-30d}
      AUTH_RESET_TTL: ${AUTH_RESET_TTL:-30m}
      AUTH_RESET_COOLDOWN: ${AUTH_RESET_COOLDOWN:-5m}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-30}
      AUTH_PUBLIC_DOCS: ${AUTH_PUBLIC_DOCS:-false}
      AUTH_RESET_MAIL_ENABLED: ${AUTH_RESET_MAIL_ENABLED:-false}
      AUTH_RESET_MAIL_FROM: ${AUTH_RESET_MAIL_FROM:-}
      AUTH_RESET_URL: ${AUTH_RESET_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      MAIL_SSL_ENABLED: ${MAIL_SSL_ENABLED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
