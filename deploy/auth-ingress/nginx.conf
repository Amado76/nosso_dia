worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;

    # Empty keys are not counted, so only authentication POSTs use this zone.
    map $request_method $auth_client_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $auth_client_key zone=auth_per_client:10m rate=30r/m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream beehome {
        zone beehome 64k;
        server app:8080 resolve;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        client_max_body_size 11m;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @auth_limited;

        # The app accepts this header only from this ingress IP.
        proxy_set_header Host $host;
        proxy_set_header X-BeeHome-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";

        location ^~ /api/auth/ {
            client_max_body_size 1m;
            limit_req zone=auth_per_client burst=29 nodelay;
            proxy_pass http://beehome;
        }

        location / {
            proxy_pass http://beehome;
        }

        location @auth_limited {
            default_type application/problem+json;
            add_header Retry-After 60 always;
            add_header X-BeeHome-Limit ingress always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests. Please try again later.","code":"RATE_LIMITED"}';
        }
    }
}
