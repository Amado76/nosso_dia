spring.application.name=nosso-dia
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nosso_dia}
spring.datasource.username=${DB_USERNAME:nosso_dia}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=nosso_dia
spring.flyway.locations=classpath:db/migration

spring.security.user.name=${APP_SECURITY_USERNAME:dev}
spring.security.user.password=${APP_SECURITY_PASSWORD:}
