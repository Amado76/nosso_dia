spring.application.name=beehome
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beehome}
spring.datasource.username=${DB_USERNAME:beehome}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=beehome
spring.flyway.locations=classpath:db/migration

auth.signing-key=${AUTH_SIGNING_KEY:}
auth.allow-ephemeral-key=${AUTH_ALLOW_EPHEMERAL_KEY:false}
auth.issuer=${AUTH_ISSUER:beehome}
auth.access-ttl=${AUTH_ACCESS_TTL:15m}
auth.refresh-ttl=${AUTH_REFRESH_TTL:30d}
auth.reset-ttl=${AUTH_RESET_TTL:30m}
auth.reset-cooldown=${AUTH_RESET_COOLDOWN:5m}
auth.public-docs=${AUTH_PUBLIC_DOCS:false}
auth.requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:30}

spring.messages.fallback-to-system-locale=false

auth.reset-mail.enabled=${AUTH_RESET_MAIL_ENABLED:false}
auth.reset-mail.from=${AUTH_RESET_MAIL_FROM:}
auth.reset-mail.reset-url=${AUTH_RESET_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.ssl.enable]=${MAIL_SSL_ENABLED:false}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.debug]=false

media.storage-directory=${MEDIA_STORAGE_DIRECTORY:${user.home}/.beehome/media}
media.max-bytes=${MEDIA_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_REQUEST_BYTES:11534336}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_BYTES:11534336}
