<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeHome documentation graph</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e26;--text:#ececf1;--muted:#a2a5b0;--edge:#555c6d;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;overflow:hidden}
header{position:absolute;z-index:1;top:18px;left:22px;max-width:440px;padding:16px 18px;background:#1b1e26eF;border:1px solid #343844;border-radius:12px;box-shadow:0 8px 30px #0006}
h1{font-size:18px;margin:0 0 5px}p{font-size:13px;color:var(--muted);margin:0 0 12px}.controls{display:flex;gap:8px;align-items:center}
input{min-width:0;width:220px;padding:8px 10px;color:var(--text);background:#111318;border:1px solid #454a58;border-radius:7px}button{padding:8px 10px;color:var(--text);background:#303440;border:0;border-radius:7px;cursor:pointer}button:hover{background:#44495a}
#count{font-size:12px;color:var(--muted);margin-left:3px}canvas{width:100vw;height:100vh;display:block;cursor:grab}canvas:active{cursor:grabbing}
.help{position:absolute;right:18px;bottom:14px;color:var(--muted);font-size:12px;background:#1b1e26dd;padding:8px 11px;border-radius:8px}
</style>
</head>
<body>
<header><h1>BeeHome documentation graph</h1><p>Explore relationships from local Markdown links. Select a document to open it.</p>
<div class="controls"><input id="search" type="search" placeholder="Find a document…"><button id="reset">Reset view</button><span id="count"></span></div></header>
<canvas id="graph"></canvas><div class="help">Drag to pan · scroll to zoom · click a node to open</div>
<script>
const data={"nodes": [{"id": "README.md", "label": "README", "path": "README.md"}, {"id": "AGENTS.md", "label": "AGENTS", "path": "AGENTS.md"}, {"id": "docs/api.md", "label": "api", "path": "docs/api.md"}, {"id": "docs/architecture.md", "label": "architecture", "path": "docs/architecture.md"}, {"id": "docs/authentication.md", "label": "authentication", "path": "docs/authentication.md"}, {"id": "docs/books-reading.md", "label": "books-reading", "path": "docs/books-reading.md"}, {"id": "docs/calendar-history-reports.md", "label": "calendar-history-reports", "path": "docs/calendar-history-reports.md"}, {"id": "docs/daily-execution.md", "label": "daily-execution", "path": "docs/daily-execution.md"}, {"id": "docs/email-setup.md", "label": "email-setup", "path": "docs/email-setup.md"}, {"id": "docs/families.md", "label": "families", "path": "docs/families.md"}, {"id": "docs/family-members.md", "label": "family-members", "path": "docs/family-members.md"}, {"id": "docs/pdr-02-family-authorization-prd.md", "label": "pdr-02-family-authorization-prd", "path": "docs/pdr-02-family-authorization-prd.md"}, {"id": "docs/pdr-03-family-members-prd.md", "label": "pdr-03-family-members-prd", "path": "docs/pdr-03-family-members-prd.md"}, {"id": "docs/pdr-04-routines-daily-planning-prd.md", "label": "pdr-04-routines-daily-planning-prd", "path": "docs/pdr-04-routines-daily-planning-prd.md"}, {"id": "docs/pdr-05-daily-execution-history-prd.md", "label": "pdr-05-daily-execution-history-prd", "path": "docs/pdr-05-daily-execution-history-prd.md"}, {"id": "docs/pdr-06-study-tracking-prd.md", "label": "pdr-06-study-tracking-prd", "path": "docs/pdr-06-study-tracking-prd.md"}, {"id": "docs/pdr-07-photos-media-prd.md", "label": "pdr-07-photos-media-prd", "path": "docs/pdr-07-photos-media-prd.md"}, {"id": "docs/pdr-08-books-reading-prd.md", "label": "pdr-08-books-reading-prd", "path": "docs/pdr-08-books-reading-prd.md"}, {"id": "docs/pdr-09-calendar-history-reports-prd.md", "label": "pdr-09-calendar-history-reports-prd", "path": "docs/pdr-09-calendar-history-reports-prd.md"}, {"id": "docs/persistence.md", "label": "persistence", "path": "docs/persistence.md"}, {"id": "docs/photos-media.md", "label": "photos-media", "path": "docs/photos-media.md"}, {"id": "docs/planning.md", "label": "planning", "path": "docs/planning.md"}, {"id": "docs/security.md", "label": "security", "path": "docs/security.md"}, {"id": "docs/study-tracking.md", "label": "study-tracking", "path": "docs/study-tracking.md"}, {"id": "docs/testing.md", "label": "testing", "path": "docs/testing.md"}], "edges": [["AGENTS.md", "docs/api.md"], ["AGENTS.md", "docs/architecture.md"], ["AGENTS.md", "docs/persistence.md"], ["AGENTS.md", "docs/security.md"], ["AGENTS.md", "docs/testing.md"], ["README.md", "AGENTS.md"], ["README.md", "docs/api.md"], ["README.md", "docs/architecture.md"], ["README.md", "docs/authentication.md"], ["README.md", "docs/books-reading.md"], ["README.md", "docs/calendar-history-reports.md"], ["README.md", "docs/daily-execution.md"], ["README.md", "docs/email-setup.md"], ["README.md", "docs/families.md"], ["README.md", "docs/family-members.md"], ["README.md", "docs/pdr-02-family-authorization-prd.md"], ["README.md", "docs/pdr-03-family-members-prd.md"], ["README.md", "docs/pdr-04-routines-daily-planning-prd.md"], ["README.md", "docs/pdr-05-daily-execution-history-prd.md"], ["README.md", "docs/pdr-06-study-tracking-prd.md"], ["README.md", "docs/pdr-07-photos-media-prd.md"], ["README.md", "docs/pdr-08-books-reading-prd.md"], ["README.md", "docs/pdr-09-calendar-history-reports-prd.md"], ["README.md", "docs/persistence.md"], ["README.md", "docs/photos-media.md"], ["README.md", "docs/planning.md"], ["README.md", "docs/security.md"], ["README.md", "docs/study-tracking.md"], ["README.md", "docs/testing.md"], ["docs/api.md", "AGENTS.md"], ["docs/api.md", "docs/authentication.md"], ["docs/api.md", "docs/security.md"], ["docs/api.md", "docs/testing.md"], ["docs/architecture.md", "AGENTS.md"], ["docs/architecture.md", "README.md"], ["docs/architecture.md", "docs/security.md"], ["docs/authentication.md", "README.md"], ["docs/authentication.md", "docs/api.md"], ["docs/authentication.md", "docs/email-setup.md"], ["docs/books-reading.md", "docs/authentication.md"], ["docs/books-reading.md", "docs/calendar-history-reports.md"], ["docs/books-reading.md", "docs/family-members.md"], ["docs/books-reading.md", "docs/photos-media.md"], ["docs/calendar-history-reports.md", "docs/authentication.md"], ["docs/calendar-history-reports.md", "docs/books-reading.md"], ["docs/calendar-history-reports.md", "docs/daily-execution.md"], ["docs/calendar-history-reports.md", "docs/study-tracking.md"], ["docs/daily-execution.md", "docs/api.md"], ["docs/daily-execution.md", "docs/authentication.md"], ["docs/daily-execution.md", "docs/families.md"], ["docs/daily-execution.md", "docs/family-members.md"], ["docs/daily-execution.md", "docs/planning.md"], ["docs/email-setup.md", "README.md"], ["docs/email-setup.md", "docs/authentication.md"], ["docs/families.md", "README.md"], ["docs/families.md", "docs/api.md"], ["docs/families.md", "docs/authentication.md"], ["docs/families.md", "docs/family-members.md"], ["docs/families.md", "docs/pdr-02-family-authorization-prd.md"], ["docs/families.md", "docs/planning.md"], ["docs/family-members.md", "docs/api.md"], ["docs/family-members.md", "docs/authentication.md"], ["docs/family-members.md", "docs/families.md"], ["docs/pdr-02-family-authorization-prd.md", "docs/api.md"], ["docs/pdr-02-family-authorization-prd.md", "docs/families.md"], ["docs/pdr-02-family-authorization-prd.md", "docs/testing.md"], ["docs/pdr-03-family-members-prd.md", "docs/family-members.md"], ["docs/pdr-05-daily-execution-history-prd.md", "docs/daily-execution.md"], ["docs/pdr-08-books-reading-prd.md", "docs/books-reading.md"], ["docs/pdr-08-books-reading-prd.md", "docs/pdr-09-calendar-history-reports-prd.md"], ["docs/pdr-09-calendar-history-reports-prd.md", "docs/books-reading.md"], ["docs/pdr-09-calendar-history-reports-prd.md", "docs/calendar-history-reports.md"], ["docs/persistence.md", "AGENTS.md"], ["docs/persistence.md", "docs/testing.md"], ["docs/planning.md", "README.md"], ["docs/planning.md", "docs/api.md"], ["docs/planning.md", "docs/authentication.md"], ["docs/planning.md", "docs/families.md"], ["docs/planning.md", "docs/family-members.md"], ["docs/planning.md", "docs/pdr-04-routines-daily-planning-prd.md"], ["docs/security.md", "AGENTS.md"], ["docs/security.md", "docs/architecture.md"], ["docs/security.md", "docs/authentication.md"], ["docs/security.md", "docs/families.md"], ["docs/testing.md", "AGENTS.md"]]};
const canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),search=document.querySelector('#search'),count=document.querySelector('#count');
let w,h,dpr=1,scale=1,offset={x:0,y:0},drag=null,hover=null;
const nodes=data.nodes.map((n,i)=>({...n,x:Math.cos(i*2.4)*180+(Math.random()-.5)*60,y:Math.sin(i*2.4)*180+(Math.random()-.5)*60,vx:0,vy:0}));
const byId=new Map(nodes.map(n=>[n.id,n])),edges=data.edges.map(([a,b])=>({a:byId.get(a),b:byId.get(b)})).filter(e=>e.a&&e.b);
function resize(){dpr=devicePixelRatio||1;w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function label(n){return n.label.replaceAll('-',' ')}
function step(){for(const n of nodes){n.vx-=n.x*.0008;n.vy-=n.y*.0008}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+1,f=950/d2;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f}for(const e of edges){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-145)*.002;e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f}for(const n of nodes){n.vx*=.88;n.vy*=.88;n.x+=n.vx;n.y+=n.vy}}
function screen(n){return{x:w/2+offset.x+n.x*scale,y:h/2+offset.y+n.y*scale}}
function draw(){step();ctx.clearRect(0,0,w,h);const q=search.value.trim().toLowerCase(),active=nodes.filter(n=>!q||label(n).toLowerCase().includes(q)||n.id.toLowerCase().includes(q));const activeSet=new Set(active);count.textContent=`${active.length} / ${nodes.length} documents`;
for(const e of edges){const a=screen(e.a),b=screen(e.b),on=activeSet.has(e.a)&&activeSet.has(e.b);ctx.strokeStyle=on?'#687084':'#343844';ctx.globalAlpha=on?.75:.16;ctx.lineWidth=on?1.2:.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.globalAlpha=1;
for(const n of nodes){const p=screen(n),on=activeSet.has(n),r=n===hover?8:6;ctx.globalAlpha=on?1:.18;ctx.fillStyle=n.id.endsWith('-prd.md')?'#e3a85e':n.id==='AGENTS.md'?'#f07892':n.id==='README.md'?'#73c9b0':'#a78bfa';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.font=`${n===hover?'600 ':''}12px system-ui`;ctx.fillStyle=n===hover?'#fff':on?'#d6d7df':'#727783';ctx.fillText(label(n),p.x+11,p.y+4)}ctx.globalAlpha=1;requestAnimationFrame(draw)}
function point(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
function hit(p){return nodes.find(n=>{const s=screen(n);return Math.hypot(p.x-s.x,p.y-s.y)<12})}
canvas.addEventListener('pointerdown',e=>{const p=point(e);drag={x:p.x,y:p.y,ox:offset.x,oy:offset.y,node:hit(p)};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{const p=point(e);hover=hit(p);if(drag&&!drag.node){offset.x=drag.ox+p.x-drag.x;offset.y=drag.oy+p.y-drag.y}});
canvas.addEventListener('pointerup',e=>{if(drag?.node&&hit(point(e))===drag.node){const base=location.href.substring(0,location.href.lastIndexOf('/')+1);location.href=new URL('../'+drag.node.path,base).href}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=point(e),factor=e.deltaY<0?1.1:.9;scale=Math.max(.35,Math.min(2.8,scale*factor));const after=point(e);offset.x+=(after.x-w/2-offset.x)*(1-factor);offset.y+=(after.y-h/2-offset.y)*(1-factor)},{passive:false});
document.querySelector('#reset').onclick=()=>{scale=1;offset={x:0,y:0};search.value=''};search.addEventListener('input',()=>{});addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
